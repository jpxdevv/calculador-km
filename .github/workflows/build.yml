name: Construir apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            nombre: CalculadorKM-Windows
          - os: macos-latest
            nombre: CalculadorKM-Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Empaquetar
        run: pyinstaller --noconfirm --windowed --name CalculadorKM app.py
      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/CalculadorKM -DestinationPath ${{ matrix.nombre }}.zip
      - name: Comprimir (Mac)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent CalculadorKM.app ../${{ matrix.nombre }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
